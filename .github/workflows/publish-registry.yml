name: Publish to MCP Registry

# Lists the version in server.json in the official MCP Registry (registry.modelcontextprotocol.io).
# Manual only, and only from main. The registry accepts an organisation namespace (io.github.repyh-com/*)
# from GitHub Actions because the run's OIDC token proves which repository owner is publishing; an
# interactive `mcp-publisher login github` cannot. No stored secret is used.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Give this environment a required reviewer and limit it to main (Settings > Environments): the run then waits
    # for a person before the OIDC token is issued. Until that is configured the environment adds no gate.
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.16"
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the npm package matches server.json
        run: |
          set -euo pipefail
          name="$(node -p 'require("./server.json").name')"
          version="$(node -p 'require("./server.json").version')"
          [ "$(node -p 'require("./package.json").version')" = "$version" ] || { echo "::error::package.json and server.json disagree on the version"; exit 1; }
          [ "$(node -p 'require("./server.json").packages[0].version')" = "$version" ] || { echo "::error::server.json lists a different npm package version"; exit 1; }
          published="$(npm view "nuvc-mcp@${version}" mcpName 2>/dev/null || true)"
          [ "$published" = "$name" ] || { echo "::error::nuvc-mcp@${version} is not on npm with mcpName ${name}. Publish it to npm first."; exit 1; }
        timeout-minutes: 2
      - name: Install mcp-publisher (pinned release, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
        timeout-minutes: 2
      - name: Validate server.json
        run: ./mcp-publisher validate
        timeout-minutes: 1
      - name: Sign in with this run's OIDC token
        run: ./mcp-publisher login github-oidc
        timeout-minutes: 1
      - name: Publish
        run: ./mcp-publisher publish
        timeout-minutes: 2
